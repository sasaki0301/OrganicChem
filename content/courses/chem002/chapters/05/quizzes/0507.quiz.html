<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 5 – Lesson 7 Quiz: Mixed Alkene–Alkyne Compounds</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;

    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {

    border-radius: 18px;

    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
  }

  * { box-sizing: border-box; }
  .choice:focus-visible, button:focus-visible { outline: 3px solid #ad7115; outline-offset: 3px; }
  .choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
  .choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
  .choice:disabled { opacity: 1; cursor: default; }
  .quiz-btn:disabled { opacity: .5; cursor: not-allowed; }
  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  /* Progress */
  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Question */
  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }
  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-size: 1.05em;
    transition: 0.2s;
  }
  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .explanation {
    background: #eef3ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    display: none;
    text-align: left;
    font-size: 1.05em;
  }

  /* Buttons */
  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
  }
  .next-btn:hover { background: #0f5b52; }

  /* Result */
  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 12px;
  }
  .stars {
    font-size: 2.5em;
    margin-top: 10px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: 0.2s;
  }
  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media(max-width:600px){
    .quiz-container { padding: 25px; }
    .question { font-size: 1.15em; }
    .stars { font-size: 2em; }
  }
.choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
.choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }

<body>

<script>

  {
    "q": "Name the compound represented by this skeletal formula.<svg style=\"display:block;width:100%;max-width:400px;height:auto;margin:12px auto\" viewBox=\"0 0 330 240\" role=\"img\" aria-labelledby=\"t8 d8\"><title id=\"t8\">Skeletal formula</title><desc id=\"d8\">An enyne chain at a junction: the upper path has two carbons and the lower path has one.</desc><line x1=\"25.0\" y1=\"180.0\" x2=\"70.0\" y2=\"150.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"28.3\" y1=\"185.0\" x2=\"73.3\" y2=\"155.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"70.0\" y1=\"150.0\" x2=\"115.0\" y2=\"150.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"115.0\" y1=\"150.0\" x2=\"160.0\" y2=\"150.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"115.0\" y1=\"145.5\" x2=\"160.0\" y2=\"145.5\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"115.0\" y1=\"154.5\" x2=\"160.0\" y2=\"154.5\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"160.0\" y1=\"150.0\" x2=\"205.0\" y2=\"150.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"205.0\" y1=\"150.0\" x2=\"250.0\" y2=\"105.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"250.0\" y1=\"105.0\" x2=\"295.0\" y2=\"105.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"205.0\" y1=\"150.0\" x2=\"250.0\" y2=\"195.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/></svg>",

    ],
    "a": 0,
    "e": "The longest chain containing both multiple bonds turns along the two-carbon path and has seven carbons. The double bond is at 1, triple bond at 3, and methyl at 5."
  },
  {
    "q": "What is the correct name of this structural formula?<svg style=\"display:block;width:100%;max-width:400px;height:auto;margin:12px auto\" viewBox=\"0 0 330 240\" role=\"img\" aria-labelledby=\"t9 d9\"><title id=\"t9\">Structural formula</title><desc id=\"d9\">An enyne chain continuing through two junctions with a methyl group at each.</desc><line x1=\"32.0\" y1=\"173.0\" x2=\"43.0\" y2=\"162.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"36.3\" y1=\"177.2\" x2=\"47.2\" y2=\"166.3\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"72.0\" y1=\"150.0\" x2=\"78.0\" y2=\"150.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"112.0\" y1=\"150.0\" x2=\"118.0\" y2=\"150.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"112.0\" y1=\"145.5\" x2=\"118.0\" y2=\"145.5\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"112.0\" y1=\"154.5\" x2=\"118.0\" y2=\"154.5\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"152.0\" y1=\"150.0\" x2=\"158.0\" y2=\"150.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"187.0\" y1=\"138.0\" x2=\"203.0\" y2=\"122.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"232.0\" y1=\"110.0\" x2=\"238.0\" y2=\"110.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"267.8\" y1=\"98.8\" x2=\"282.2\" y2=\"86.2\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"175.0\" y1=\"167.0\" x2=\"175.0\" y2=\"183.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><line x1=\"215.0\" y1=\"93.0\" x2=\"215.0\" y2=\"72.0\" stroke=\"#136f63\" stroke-width=\"2.6\"/><text x=\"20\" y=\"191\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">CH₂</text><text x=\"55\" y=\"156\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">CH</text><text x=\"95\" y=\"156\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">C</text><text x=\"135\" y=\"156\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">C</text><text x=\"175\" y=\"156\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">CH</text><text x=\"215\" y=\"116\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">CH</text><text x=\"255\" y=\"116\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">CH₂</text><text x=\"295\" y=\"81\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">CH₃</text><text x=\"175\" y=\"206\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">CH₃</text><text x=\"215\" y=\"61\" text-anchor=\"middle\" font-size=\"16\" fill=\"#174ea6\" font-weight=\"600\">CH₃</text></svg>",
    "c": [
      "3,4-dimethyloct-7-en-5-yne",
      "5,6-dimethyloct-1-en-3-yne",
      "5-ethyloct-1-en-3-yne",

    ],
    "a": 1,
    "e": "The parent path containing both multiple bonds has eight carbons. Number from the alkene end to give C=C at 1, C≡C at 3, and methyl groups at 5 and 6."
  },
  {

    "c": [
      "pent-4-en-1-yne",
      "pent-1-en-3-yne",
      "pent-1-en-4-yne",
      "hex-1-en-5-yne"
    ],
    "a": 2,
    "e": "The five-carbon chain has terminal multiple bonds. Both directions give 1,4, so the double bond receives locant 1: pent-1-en-4-yne."
  },
  {
    "q": "Which condensed formula represents hex-1-en-3-yne?",
    "c": [
      "CH₃–CH=CH–C≡C–CH₃",
      "CH₂=CH–CH₂–C≡C–CH₃",
      "HC≡C–CH₂–CH₂–CH=CH₂",
      "CH₂=CH–C≡C–CH₂–CH₃"
    ],
    "a": 3,
    "e": "Hex-1-en-3-yne has six carbons, C=C between C-1 and C-2, and C≡C between C-3 and C-4: CH₂=CH–C≡C–CH₂–CH₃."
  },
  {
    "q": "What is the molecular formula of an acyclic six-carbon hydrocarbon with exactly one C=C and one C≡C, and no other multiple bonds?",
    "c": [
      "C₆H₈",
      "C₆H₁₀",
      "C₆H₁₂",
      "C₆H₁₄"
    ],
    "a": 0,
    "e": "One double bond and one triple bond reduce the acyclic alkane hydrogen count by six. Starting from C₆H₁₄ gives C₆H₈."
  },
  {
    "q": "In the name 4-methylpent-3-en-1-yne, why is en written before yne?",
    "c": [
      "Because the double-bond locant is always lower",
      "Because substituents are ignored in naming",
      "Because the parent name places en before yne even when the triple-bond locant is lower",
      "Because the triple bond has no locant"
    ],
    "a": 2,
    "e": "In a name containing both, en is written before yne. Numbering is decided separately by comparing the multiple-bond locant sets."
  }
];

/* ============================
       QUIZ LOGIC
============================= */

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox' role='status' aria-live='polite'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    if (idx === quizData[current].a) btn.classList.add("correct");
    if (idx === i && i !== quizData[current].a) btn.classList.add("incorrect");
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br><strong>Correct answer:</strong> ${q.c[q.a]}<br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Sending your result to LearnTrack...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Result sent. Retake the quiz to meet the 80% target.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();

</script>
</body>
</html>
