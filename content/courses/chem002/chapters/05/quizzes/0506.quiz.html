<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 5 – Lesson 6 Quiz: Cycloalkynes</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
  }

  * { box-sizing: border-box; }
  .choice:focus-visible, button:focus-visible { outline: 3px solid #ad7115; outline-offset: 3px; }
  .choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
  .choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
  .choice:disabled { opacity: 1; cursor: default; }
  .quiz-btn:disabled { opacity: .5; cursor: not-allowed; }
  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  /* Progress */
  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Question */
  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }
  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-size: 1.05em;
    transition: 0.2s;
  }
  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .explanation {
    background: #eef3ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    display: none;
    text-align: left;
    font-size: 1.05em;
  }

  /* Buttons */
  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
  }
  .next-btn:hover { background: #0f5b52; }

  /* Result */
  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 12px;
  }
  .stars {
    font-size: 2.5em;
    margin-top: 10px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: 0.2s;
  }
  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media(max-width:600px){
    .quiz-container { padding: 25px; }
    .question { font-size: 1.15em; }
    .stars { font-size: 2em; }
  }
.choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
.choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Lesson 6 Quiz – Cycloalkynes</h2>

  <p>10 questions · Pass: 8/10 (80% required). Choose one answer; your first choice is final. Read the explanation before continuing.</p>
  <div id="progressText" class="progress-text">Question 1 of 10</div>
  <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
/* ============================
     QUIZ DATA
============================= */

const quizData = [
  {

      "A cyclic compound with a C=C but no C≡C"
    ],
    "a": 0,
    "e": "A cycloalkyne is a cyclic hydrocarbon containing a carbon–carbon triple bond within a ring."
  },
  {
    "q": "Which formula describes cyclooctyne: one eight-carbon ring containing one C≡C and no other multiple bonds?",
    "c": [
      "C₈H₁₆",
      "C₈H₁₄",
      "C₈H₁₂",
      "C₈H₁₀"
    ],
    "a": 2,
    "e": "For one ring and one triple bond, with no other rings or multiple bonds, CₙH₂ₙ₋₄ applies. When n = 8, the formula is C₈H₁₂."
  },
  {
    "q": "What does the C≡C triple bond contain?",
    "c": [
      "Two σ bonds and one π bond",
      "One σ bond and two π bonds",

      "No σ bonds and three π bonds"
    ],
    "a": 1,
    "e": "A carbon–carbon triple bond contains one sigma bond and two pi bonds."
  },
  {
    "q": "Why can a small cycloalkyne ring be highly strained?",
    "c": [
      "The ring forces the alkyne framework to bend away from its preferred near-linear geometry",
      "The ring removes the π bonds from C≡C",
      "The alkyne carbons must become oxygen atoms",
      "The molecule contains too many hydrogen atoms"
    ],
    "a": 0,
    "e": "A ring can force the framework near C≡C away from the approximately linear geometry favored in an ordinary acyclic alkyne, contributing to ring strain."
  },
  {
    "q": "Which statement accurately compares unsubstituted cyclohexyne and cyclooctyne?",
    "c": [
      "Cyclohexyne is generally easier to isolate because its ring is smaller",
      "Cyclooctyne has no ring strain",
      "Cyclooctyne is commonly isolated, while cyclohexyne is highly strained and typically generated as a transient intermediate",
      "Both compounds must have exactly the same stability"
    ],
    "a": 2,
    "e": "Unsubstituted cyclooctyne is commonly isolated but remains strained. The smaller cyclohexyne is much more constrained and is generally generated and trapped as a transient intermediate."
  },
  {
    "q": "Name the skeletal structure shown.<svg style=\"display:block;width:100%;max-width:370px;height:auto;margin:12px auto\" viewBox=\"0 0 400 290\" role=\"img\" aria-labelledby=\"t4 d4\"><title id=\"t4\">Skeletal formula</title><desc id=\"d4\">8-carbon ring with a triple bond on one edge.</desc><line x1=\"200.0\" y1=\"63.0\" x2=\"258.0\" y2=\"87.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"204.7\" y1=\"72.5\" x2=\"247.9\" y2=\"90.4\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"208.5\" y1=\"81.7\" x2=\"238.8\" y2=\"94.2\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"258.0\" y1=\"87.0\" x2=\"282.0\" y2=\"145.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"282.0\" y1=\"145.0\" x2=\"258.0\" y2=\"203.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"258.0\" y1=\"203.0\" x2=\"200.0\" y2=\"227.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"200.0\" y1=\"227.0\" x2=\"142.0\" y2=\"203.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"142.0\" y1=\"203.0\" x2=\"118.0\" y2=\"145.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"118.0\" y1=\"145.0\" x2=\"142.0\" y2=\"87.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"142.0\" y1=\"87.0\" x2=\"200.0\" y2=\"63.0\" stroke=\"#136f63\" stroke-width=\"3\" /></svg>",
    "c": [
      "cyclohexyne",
      "cyclooctane",
      "cyclooctene",
      "cyclooctyne"
    ],
    "a": 3,
    "e": "The skeletal ring has eight carbon vertices and one endocyclic triple bond. Its name is cyclooctyne, also written cyclooct-1-yne."
  },
  {
    "q": "What is the IUPAC name for the structural formula shown?<svg style=\"display:block;width:100%;max-width:370px;height:auto;margin:12px auto\" viewBox=\"0 0 400 290\" role=\"img\" aria-labelledby=\"t5 d5\"><title id=\"t5\">Displayed structural formula</title><desc id=\"d5\">8-carbon ring with a triple bond on one edge and methyl attached to a ring carbon.</desc><line x1=\"219.4\" y1=\"71.0\" x2=\"238.6\" y2=\"79.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"218.6\" y1=\"78.3\" x2=\"234.1\" y2=\"84.7\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"218.7\" y1=\"85.9\" x2=\"228.6\" y2=\"90.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"266.0\" y1=\"106.4\" x2=\"274.0\" y2=\"125.6\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"274.0\" y1=\"164.4\" x2=\"266.0\" y2=\"183.6\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"238.6\" y1=\"211.0\" x2=\"219.4\" y2=\"219.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"180.6\" y1=\"219.0\" x2=\"161.4\" y2=\"211.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"134.0\" y1=\"183.6\" x2=\"126.0\" y2=\"164.4\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"126.0\" y1=\"125.6\" x2=\"134.0\" y2=\"106.4\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"161.4\" y1=\"79.0\" x2=\"180.6\" y2=\"71.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"303.0\" y1=\"145.0\" x2=\"310.0\" y2=\"145.0\" stroke=\"#136f63\" stroke-width=\"3\" /><text x=\"330.0\" y=\"151.0\" text-anchor=\"middle\" font-size=\"17\" fill=\"#174ea6\" font-weight=\"600\">CH₃</text><text x=\"200.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"17\" fill=\"#174ea6\" font-weight=\"600\">C</text><text x=\"258.0\" y=\"93.0\" text-anchor=\"middle\" font-size=\"17\" fill=\"#174ea6\" font-weight=\"600\">C</text><text x=\"282.0\" y=\"151.0\" text-anchor=\"middle\" font-size=\"17\" fill=\"#174ea6\" font-weight=\"600\">CH</text><text x=\"258.0\" y=\"209.0\" text-anchor=\"middle\" font-size=\"17\" fill=\"#174ea6\" font-weight=\"600\">CH₂</text><text x=\"200.0\" y=\"233.0\" text-anchor=\"middle\" font-size=\"17\" fill=\"#174ea6\" font-weight=\"600\">CH₂</text><text x=\"142.0\" y=\"209.0\" text-anchor=\"middle\" font-size=\"17\" fill=\"#174ea6\" font-weight=\"600\">CH₂</text><text x=\"118.0\" y=\"151.0\" text-anchor=\"middle\" font-size=\"17\" fill=\"#174ea6\" font-weight=\"600\">CH₂</text><text x=\"142.0\" y=\"93.0\" text-anchor=\"middle\" font-size=\"17\" fill=\"#174ea6\" font-weight=\"600\">CH₂</text></svg>",
    "c": [
      "8-methylcyclooct-1-yne",
      "3-methylcyclooct-1-yne",
      "3-ethylcyclooct-1-yne",
      "1-methylcyclooct-3-yne"
    ],
    "a": 1,
    "e": "Number the ring triple-bond carbons 1 and 2. Choose the direction that gives the methyl-bearing carbon locant 3 rather than 8."
  },
  {
    "q": "Name the skeletal structure shown; stereochemistry is unspecified.<svg style=\"display:block;width:100%;max-width:370px;height:auto;margin:12px auto\" viewBox=\"0 0 400 290\" role=\"img\" aria-labelledby=\"t8 d8\"><title id=\"t8\">Skeletal formula</title><desc id=\"d8\">8-carbon ring with a triple bond on one edge and ethyl attached to a ring carbon, methyl attached to a ring carbon.</desc><line x1=\"200.0\" y1=\"63.0\" x2=\"258.0\" y2=\"87.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"204.7\" y1=\"72.5\" x2=\"247.9\" y2=\"90.4\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"208.5\" y1=\"81.7\" x2=\"238.8\" y2=\"94.2\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"258.0\" y1=\"87.0\" x2=\"282.0\" y2=\"145.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"282.0\" y1=\"145.0\" x2=\"258.0\" y2=\"203.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"258.0\" y1=\"203.0\" x2=\"200.0\" y2=\"227.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"200.0\" y1=\"227.0\" x2=\"142.0\" y2=\"203.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"142.0\" y1=\"203.0\" x2=\"118.0\" y2=\"145.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"118.0\" y1=\"145.0\" x2=\"142.0\" y2=\"87.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"142.0\" y1=\"87.0\" x2=\"200.0\" y2=\"63.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"282.0\" y1=\"145.0\" x2=\"330.0\" y2=\"145.0\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"330.0\" y1=\"145.0\" x2=\"367.1\" y2=\"159.8\" stroke=\"#136f63\" stroke-width=\"3\" /><line x1=\"142.0\" y1=\"203.0\" x2=\"108.1\" y2=\"236.9\" stroke=\"#136f63\" stroke-width=\"3\" /></svg>",
    "c": [
      "5-methyl-8-ethylcyclooct-1-yne",
      "3-methyl-6-ethylcyclooct-1-yne",
      "3-ethyl-6-methylcyclooct-1-yne",
      "3-ethyl-6-methylcyclohex-1-yne"
    ],
    "a": 2,
    "e": "The two numbering directions give sorted locant sets 3,6 and 5,8; 3,6 wins. List the different substituents alphabetically: ethyl before methyl."
  },
  {
    "q": "For a simple monocyclic ring with one endocyclic triple bond and alkyl substituents, which numbering procedure should be used?",
    "c": [
      "Give the triple-bond carbons locants 1 and 2, then choose the lowest substituent locants",
      "Give the largest substituent locant 1, regardless of the triple bond",
      "Number only the substituents and omit the ring carbons",
      "Always begin at an unsubstituted ring carbon farthest from C≡C"
    ],
    "a": 0,
    "e": "For the simple examples in this lesson, the triple bond is assigned carbons 1 and 2; choose the direction that gives the lower substituent locant set."
  },
  {
    "q": "Which statement about cyclooctyne-based reagents is accurate?",
    "c": [
      "They are always inert toward azides",
      "Some can react with organic azides in copper-free strain-promoted cycloaddition",
      "Every cycloalkyne reacts at the same rate under all conditions",
      "They must contain a metal atom to react"
    ],
    "a": 1,
    "e": "Some suitably designed cyclooctyne reagents react with azides by strain-promoted azide–alkyne cycloaddition without a copper catalyst. Reactivity depends on the reagents and conditions."
  }
];

/* ============================
       QUIZ LOGIC
============================= */

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox' role='status' aria-live='polite'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    if (idx === quizData[current].a) btn.classList.add("correct");
    if (idx === i && i !== quizData[current].a) btn.classList.add("incorrect");
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br><strong>Correct answer:</strong> ${q.c[q.a]}<br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Sending your result to LearnTrack...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Result sent. Retake the quiz to meet the 80% target.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();

</script>
</body>
</html>
