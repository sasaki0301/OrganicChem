<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 5 – Lesson 1 Quiz: Naming Alkenes</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
  }

  * { box-sizing: border-box; }
  .choice:focus-visible, button:focus-visible { outline: 3px solid #ad7115; outline-offset: 3px; }
  .choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
  .choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
  .choice:disabled { opacity: 1; cursor: default; }
  .quiz-btn:disabled { opacity: .5; cursor: not-allowed; }
  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  /* Progress */
  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Question */
  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }
  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-size: 1.05em;
    transition: 0.2s;
  }
  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .explanation {
    background: #eef3ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    display: none;
    text-align: left;
    font-size: 1.05em;
  }

  /* Buttons */
  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
  }
  .next-btn:hover { background: #0f5b52; }

  /* Result */
  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 12px;
  }
  .stars {
    font-size: 2.5em;
    margin-top: 10px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: 0.2s;
  }
  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media(max-width:600px){
    .quiz-container { padding: 25px; }
    .question { font-size: 1.15em; }
    .stars { font-size: 2em; }
  }
.choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
.choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Lesson 1 Quiz – Naming Alkenes</h2>

  <p>10 questions · Pass: 8/10 (80% required). Choose one answer; your first choice is final. Read the explanation before continuing.</p>
  <div id="progressText" class="progress-text">Question 1 of 10</div>
  <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
/* ============================
     QUIZ DATA
============================= */

const quizData = [
  {
    "q": "Which feature identifies an alkene?",
    "c": [
      "A carbon–carbon single bond only",
      "A carbon–carbon triple bond",
      "At least one carbon–carbon double bond",
      "A carbon–oxygen double bond"
    ],
    "a": 2,
    "e": "An alkene is a hydrocarbon containing at least one C=C double bond."
  },
  {
    "q": "An acyclic hydrocarbon has one C=C and no other multiple bonds. What general formula does it follow?",
    "c": [
      "CₙH₂ₙ₊₂",
      "CₙH₂ₙ",
      "CₙH₂ₙ₋₂",
      "CₙH₂ₙ₊₁"
    ],
    "a": 1,
    "e": "For an acyclic hydrocarbon with exactly one double bond and no other multiple bonds, the formula is CₙH₂ₙ."
  },
  {
    "q": "What is the IUPAC name of CH₂=CH–CH₂–CH₃?",
    "c": [
      "but-2-ene",
      "pent-1-ene",
      "prop-1-ene",
      "but-1-ene"
    ],
    "a": 3,
    "e": "The parent contains four carbons. Number from the double-bond end, so the C=C starts at C-1: but-1-ene."
  },
  {
    "q": "For the simple acyclic alkenes in this lesson, which parent chain should be selected?",
    "c": [
      "The longest continuous chain containing the C=C",
      "The longest chain whether or not it includes the C=C",
      "The chain with the most branches, regardless of the C=C",
      "Any continuous carbon chain"
    ],
    "a": 0,
    "e": "Choose the longest continuous carbon chain that contains both double-bond carbons. A longer chain that excludes C=C is not eligible here."
  },
  {
    "q": "What is the correct name of this compound?<svg viewBox=\"0 0 420 225\" role=\"img\" aria-label=\"Alkene structure; the displayed formula and its bonds are shown in the diagram.\"><title>Alkene structure</title><line x1=\"80.80\" y1=\"139.55\" x2=\"141.80\" y2=\"163.95\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"78.20\" y1=\"146.05\" x2=\"139.20\" y2=\"170.45\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"179.50\" y1=\"167.20\" x2=\"240.50\" y2=\"142.80\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"279.50\" y1=\"142.80\" x2=\"340.50\" y2=\"167.20\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"260.00\" y1=\"114.00\" x2=\"260.00\" y2=\"71.00\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"60.0\" y=\"142.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#174ea6\">CH₂</text><text x=\"160.0\" y=\"182.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#174ea6\">CH</text><text x=\"260.0\" y=\"142.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#174ea6\">CH</text><text x=\"360.0\" y=\"182.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#174ea6\">CH₃</text><text x=\"260.0\" y=\"57.0\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"600\" fill=\"#174ea6\">CH₃</text></svg>",
    "c": [
      "2-methylbut-1-ene",
      "3-methylbut-1-ene",
      "2-methylbut-3-ene",
      "3-methylpent-1-ene"
    ],
    "a": 1,
    "e": "The longest chain containing C=C has four carbons. Number from the alkene end: the double bond starts at 1 and the methyl group is at 3."
  },
  {
    "q": "What is the correct name of this compound?<svg viewBox=\"0 0 420 225\" role=\"img\" aria-label=\"Alkene structure; the displayed formula and its bonds are shown in the diagram.\"><title>Alkene structure</title><line x1=\"60.00\" y1=\"135.00\" x2=\"160.00\" y2=\"175.00\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"158.70\" y1=\"171.75\" x2=\"258.70\" y2=\"131.75\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"161.30\" y1=\"178.25\" x2=\"261.30\" y2=\"138.25\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"260.00\" y1=\"135.00\" x2=\"360.00\" y2=\"175.00\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"260.00\" y1=\"135.00\" x2=\"260.00\" y2=\"50.00\" stroke=\"#136f63\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>",
    "c": [
      "3-methylbut-2-ene",
      "2-methylbut-1-ene",
      "2-methylbut-2-ene",
      "3-methylpent-2-ene"
    ],
    "a": 2,
    "e": "The double bond has locant 2 from either end. Break the tie by numbering to give methyl locant 2, rather than 3."
  },
  {
    "q": "For CH₂=C(CH₂CH₃)–CH₂–CH₂–CH₃, how many carbons are in the longest continuous chain containing the double bond?",
    "c": [
      "5",
      "6",
      "4",
      "7"
    ],
    "a": 0,
    "e": "Starting at the terminal CH₂ of C=C and following the longer path gives five carbons. The six-carbon path between the other ends excludes C=C."
  },
  {
    "q": "What is the correct name for CH₂=C(CH₂CH₃)–CH₂–CH₂–CH₃?",
    "c": [
      "2-propylbut-1-ene",
      "3-methylhex-3-ene",
      "2-ethylhex-1-ene",
      "2-ethylpent-1-ene"
    ],
    "a": 3,
    "e": "The longest chain including C=C has five carbons, with an ethyl group on C-2. The double bond starts at C-1."
  },
  {
    "q": "What is the correct name of the skeletal structure?<svg viewBox=\"0 0 360 185\" role=\"img\" aria-label=\"A skeletal formula. A terminal double bond leads through a junction where one path has one carbon and another path has two carbons.\" style=\"display:block;width:100%;max-width:360px;height:auto;margin:12px auto\"><g stroke=\"#136f63\" stroke-width=\"3.5\" fill=\"none\" stroke-linejoin=\"round\"><path d=\"M25 130 L80 90 L135 130 L190 90 L245 130 M190 90 L245 38 L305 38\"/><path d=\"M30 138 L85 98\"/></g></svg>",
    "c": [
      "4-ethylpent-1-ene",
      "4-methylhex-1-ene",
      "3-methylhex-5-ene",
      "3-ethylpent-1-ene"
    ],
    "a": 1,
    "e": "The longest chain containing C=C turns upward at the junction and has six carbons. Number from C=C: the remaining one-carbon branch is methyl at C-4."
  },
  {
    "q": "Which condensed formula represents 3-methylhex-2-ene? (Stereochemistry is unspecified.)",
    "c": [
      "CH₂=CH–CH(CH₃)–CH₂–CH₂–CH₃",
      "CH₃–CH(CH₃)–CH=CH–CH₂–CH₃",
      "CH₃–CH=C(CH₃)–CH₂–CH₂–CH₃",
      "CH₃–CH=CH–CH(CH₃)–CH₂–CH₃"
    ],
    "a": 2,
    "e": "A six-carbon parent has C=C between C-2 and C-3, with methyl attached to C-3: CH₃–CH=C(CH₃)–CH₂–CH₂–CH₃."
  }
];

/* ============================
       QUIZ LOGIC
============================= */

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox' role='status' aria-live='polite'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    if (idx === quizData[current].a) btn.classList.add("correct");
    if (idx === i && i !== quizData[current].a) btn.classList.add("incorrect");
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br><strong>Correct answer:</strong> ${q.c[q.a]}<br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Sending your result to LearnTrack...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Result sent. Retake the quiz to meet the 80% target.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();

</script>
</body>
</html>
