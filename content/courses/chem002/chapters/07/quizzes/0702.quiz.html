<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 7 – Lesson 2 Quiz: Phenols and Naming Phenols</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
  }

  * { box-sizing: border-box; }
  .choice:focus-visible, button:focus-visible { outline: 3px solid #ad7115; outline-offset: 3px; }
  .choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
  .choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
  .choice:disabled { opacity: 1; cursor: default; }
  .quiz-btn:disabled { opacity: .5; cursor: not-allowed; }
  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  /* Progress */
  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Question */
  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }
  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-size: 1.05em;
    transition: 0.2s;
  }
  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .explanation {
    background: #eef3ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    display: none;
    text-align: left;
    font-size: 1.05em;
  }

  /* Buttons */
  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
  }
  .next-btn:hover { background: #0f5b52; }

  /* Result */
  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 12px;
  }
  .stars {
    font-size: 2.5em;
    margin-top: 10px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: 0.2s;
  }
  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media(max-width:600px){
    .quiz-container { padding: 25px; }
    .question { font-size: 1.15em; }
    .stars { font-size: 2em; }
  }
.choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
.choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Lesson 2 Quiz – Phenols and Naming Phenols</h2>

  <p>10 questions · Pass: 8/10 (80% required). Choose one answer; your first choice is final. Read the explanation before continuing.</p>
  <div id="progressText" class="progress-text">Question 1 of 10</div>
  <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
/* ============================
     QUIZ DATA
============================= */

const quizData = [
  {
    "q": "Which feature identifies a phenol?",
    "c": [
      "An –OH group directly attached to an aromatic ring",
      "An –OH group attached only to an alkyl chain",
      "A benzene ring with no substituents",
      "A carbonyl group attached to a ring"
    ],
    "a": 0,
    "e": "A phenol has a hydroxyl group directly bonded to an aromatic ring carbon."
  },
  {
    "q": "Which compound is a phenol?",
    "c": [
      "C₆H₅CH₂OH",
      "C₆H₅OH",
      "CH₃CH₂OH",
      "C₆H₅CH₃"
    ],
    "a": 1,
    "e": "C₆H₅OH has –OH directly attached to the benzene ring. In C₆H₅CH₂OH, the –OH is on the side chain, making it benzyl alcohol."
  },
  {
    "q": "Why is phenol more acidic than ethanol?",
    "c": [
      "The phenoxide ion is stabilized by resonance",
      "Ethanol has no oxygen atom",
      "Phenol loses an entire hydroxyl group",
      "Phenoxide has no negative charge"
    ],
    "a": 0,
    "e": "After phenol loses H⁺, the resulting phenoxide ion is stabilized by delocalization of its negative charge. Ethoxide lacks comparable resonance stabilization."
  },
  {
    "q": "What is the name of the compound shown?<svg viewBox=\"0 0 320 245\" role=\"img\" aria-label=\"Benzene ring with OH at ring position 1, CH₃ at ring position 3\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:12px auto\"><line x1=\"160.0\" y1=\"55.0\" x2=\"216.3\" y2=\"87.5\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"216.3\" y1=\"87.5\" x2=\"216.3\" y2=\"152.5\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"216.3\" y1=\"152.5\" x2=\"160.0\" y2=\"185.0\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"160.0\" y1=\"185.0\" x2=\"103.7\" y2=\"152.5\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"103.7\" y1=\"152.5\" x2=\"103.7\" y2=\"87.5\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"103.7\" y1=\"87.5\" x2=\"160.0\" y2=\"55.0\" stroke=\"#136f63\" stroke-width=\"2.5\"/><circle cx=\"160\" cy=\"120\" r=\"38\" fill=\"none\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"160.0\" y1=\"55.0\" x2=\"160.0\" y2=\"36.0\" stroke=\"#136f63\" stroke-width=\"2.5\"/><text x=\"160.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"600\" fill=\"#174ea6\">OH</text><line x1=\"216.3\" y1=\"152.5\" x2=\"232.7\" y2=\"162.0\" stroke=\"#136f63\" stroke-width=\"2.5\"/><text x=\"246.6\" y=\"175.0\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"600\" fill=\"#174ea6\">CH₃</text></svg>",
    "c": [
      "2-methylphenol",
      "3-methylphenol",
      "4-methylphenol",
      "methylbenzene"
    ],
    "a": 1,
    "e": "The carbon bearing –OH is carbon 1. The methyl group is at carbon 3, so the name is 3-methylphenol."
  },
  {
    "q": "Name the compound represented by this formula.<svg viewBox=\"0 0 320 245\" role=\"img\" aria-label=\"Benzene ring with OH at ring position 1, Cl at ring position 2\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:12px auto\"><line x1=\"160.0\" y1=\"55.0\" x2=\"216.3\" y2=\"87.5\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"216.3\" y1=\"87.5\" x2=\"216.3\" y2=\"152.5\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"216.3\" y1=\"152.5\" x2=\"160.0\" y2=\"185.0\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"160.0\" y1=\"185.0\" x2=\"103.7\" y2=\"152.5\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"103.7\" y1=\"152.5\" x2=\"103.7\" y2=\"87.5\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"103.7\" y1=\"87.5\" x2=\"160.0\" y2=\"55.0\" stroke=\"#136f63\" stroke-width=\"2.5\"/><circle cx=\"160\" cy=\"120\" r=\"38\" fill=\"none\" stroke=\"#136f63\" stroke-width=\"2.5\"/><line x1=\"160.0\" y1=\"55.0\" x2=\"160.0\" y2=\"36.0\" stroke=\"#136f63\" stroke-width=\"2.5\"/><text x=\"160.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"600\" fill=\"#174ea6\">OH</text><line x1=\"216.3\" y1=\"87.5\" x2=\"232.7\" y2=\"78.0\" stroke=\"#136f63\" stroke-width=\"2.5\"/><text x=\"246.6\" y=\"75.0\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"600\" fill=\"#174ea6\">Cl</text></svg>",
    "c": [
      "2-chlorophenol",
      "3-chlorophenol",
      "4-chlorophenol",
      "chlorobenzene"
    ],
    "a": 0,
    "e": "Use phenol as the parent in this example. Chlorine is adjacent to the –OH group, giving 2-chlorophenol."
  },
  {
    "q": "Which name describes phenol with a methyl group opposite the –OH group?",
    "c": [
      "2-methylphenol",
      "3-methylphenol",
      "4-methylphenol",
      "methylbenzene"
    ],
    "a": 2,
    "e": "Opposite positions on a benzene ring are 1,4 (para). The compound is 4-methylphenol, also called p-cresol."
  },
  {
    "q": "A phenol has nitro at carbon 2 and methyl at carbon 4. What is its name?",
    "c": [
      "2-nitro-4-methylphenol",
      "4-methyl-2-nitrophenol",
      "2-methyl-4-nitrophenol",
      "4-nitro-2-methylphenol"
    ],
    "a": 1,
    "e": "The –OH-bearing carbon is carbon 1. The substituents retain their locants and are listed alphabetically: methyl before nitro."
  },
  {
    "q": "What is a benzene ring with two directly attached hydroxyl groups called?",
    "c": [
      "A benzenediol",
      "A benzyl alcohol",
      "A cyclohexanol",
      "An ether"
    ],
    "a": 0,
    "e": "A benzene ring bearing two directly attached –OH groups is a benzenediol, also called a dihydroxybenzene."
  },
  {
    "q": "What is the common name for benzene-1,2-diol?",
    "c": [
      "Catechol",
      "Resorcinol",
      "Hydroquinone",
      "Toluene"
    ],
    "a": 0,
    "e": "Catechol is benzene-1,2-diol: its two hydroxyl groups occupy adjacent (ortho) positions."
  },
  {
    "q": "Which pairing of benzenediol names and positions is correct?",
    "c": [
      "Resorcinol: 1,3; hydroquinone: 1,4",
      "Resorcinol: 1,4; hydroquinone: 1,3",
      "Resorcinol: 1,2; hydroquinone: 1,3",
      "Resorcinol: 1,2; hydroquinone: 1,4"
    ],
    "a": 0,
    "e": "Resorcinol is benzene-1,3-diol (meta), and hydroquinone is benzene-1,4-diol (para)."
  }
];

/* ============================
       QUIZ LOGIC
============================= */

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox' role='status' aria-live='polite'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    if (idx === quizData[current].a) btn.classList.add("correct");
    if (idx === i && i !== quizData[current].a) btn.classList.add("incorrect");
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br><strong>Correct answer:</strong> ${q.c[q.a]}<br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Sending your result to LearnTrack...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Result sent. Retake the quiz to meet the 80% target.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();

</script>
</body>
</html>
