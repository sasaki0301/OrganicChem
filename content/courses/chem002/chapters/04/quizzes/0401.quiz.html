<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 4 – Lesson 1 Quiz: Alkanes & Alkane Isomers</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
  }

  * { box-sizing: border-box; }
  .choice:focus-visible, button:focus-visible { outline: 3px solid #ad7115; outline-offset: 3px; }
  .choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
  .choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
  .choice:disabled { opacity: 1; cursor: default; }
  .quiz-btn:disabled { opacity: .5; cursor: not-allowed; }
  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  /* Progress */
  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Question */
  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }
  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-size: 1.05em;
    transition: 0.2s;
  }
  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .explanation {
    background: #eef3ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    display: none;
    text-align: left;
    font-size: 1.05em;
  }

  /* Buttons */
  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
  }
  .next-btn:hover { background: #0f5b52; }

  /* Result */
  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 12px;
  }
  .stars {
    font-size: 2.5em;
    margin-top: 10px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: 0.2s;
  }
  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media(max-width:600px){
    .quiz-container { padding: 25px; }
    .question { font-size: 1.15em; }
    .stars { font-size: 2em; }
  }
.choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
.choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Lesson 1 Quiz – Alkanes & Alkane Isomers</h2>

  <p>12 questions · Pass: 10/12 (80% required). Choose one answer; your first choice is final. Read the explanation before continuing.</p>
  <div id="progressText" class="progress-text">Question 1 of 12</div>
  <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
/* ============================
     QUIZ DATA
============================= */

const quizData = [
  {
    "q": "Which general formula applies to an acyclic alkane with n carbon atoms?",
    "c": [
      "CₙH₂ₙ",
      "CₙH₂ₙ₊₂",
      "CₙH₂ₙ₋₂",
      "CₙHₙ"
    ],
    "a": 1,
    "e": "An acyclic saturated hydrocarbon has formula CₙH₂ₙ₊₂. The formula is for open-chain alkanes."
  },
  {
    "q": "What is the molecular formula of an acyclic alkane with seven carbon atoms?",
    "c": [
      "C₇H₁₄",
      "C₇H₁₆",
      "C₇H₁₂",
      "C₇H₁₈"
    ],
    "a": 1,
    "e": "Use H = 2n + 2. With n = 7, H = 16, giving C₇H₁₆."
  },
  {
    "q": "Which description best fits an alkane?",
    "c": [
      "A hydrocarbon containing only single bonds",
      "A hydrocarbon containing at least one C=C bond",
      "A compound containing carbon and oxygen",
      "A hydrocarbon containing at least one C≡C bond"
    ],
    "a": 0,
    "e": "Alkanes are saturated hydrocarbons containing carbon and hydrogen joined by single bonds."
  },
  {
    "q": "How many carbon atoms are shown in this skeletal structure?<svg viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"A zigzag of three connected segments, with four unlabeled carbon positions\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:12px auto\"><path d=\"M30 80 L100 35 L170 80 L240 35\" fill=\"none\" stroke=\"#174ea6\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>",
    "c": [
      "3",
      "4",
      "5",
      "6"
    ],
    "a": 1,
    "e": "Count both ends and both corners. The three bonds connect four carbon positions."
  },
  {
    "q": "What is the molecular formula represented by CH₃CH(CH₃)CH₃?",
    "c": [
      "C₃H₈",
      "C₄H₈",
      "C₄H₁₀",
      "C₅H₁₂"
    ],
    "a": 2,
    "e": "The parenthesized CH₃ is attached to the preceding CH. Counting all groups gives four carbons and ten hydrogens."
  },
  {
    "q": "Which statement describes constitutional isomers?",
    "c": [
      "Same molecular formula and different atom connectivity",
      "Same connectivity and only a different orientation on the page",
      "Different molecular formulas and the same connectivity",
      "Same connectivity and only a rotation about a single bond"
    ],
    "a": 0,
    "e": "Constitutional isomers have the same molecular formula but differ in how atoms are connected."
  },
  {
    "q": "What is the relationship between butane and 2-methylpropane?",
    "c": [
      "They have different molecular formulas",
      "They are constitutional isomers of C₄H₁₀",
      "They are the same molecule drawn backwards",
      "They are cis–trans isomers"
    ],
    "a": 1,
    "e": "Both are C₄H₁₀, but their carbon connectivity differs. They are the two constitutional isomers of this formula."
  },
  {
    "q": "Which structure represents the same connectivity as CH₃CH₂CH(CH₃)CH₃?",
    "c": [
      "CH₃CH(CH₃)CH₂CH₃",
      "CH₃CH₂CH₂CH₂CH₃",
      "C(CH₃)₄",
      "CH₃CH(CH₃)CH₃"
    ],
    "a": 0,
    "e": "Reading from the other end gives CH₃CH(CH₃)CH₂CH₃. Both drawings represent 2-methylbutane."
  },
  {
    "q": "What is the IUPAC name of the alkane represented by this skeletal structure?<svg viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"One central vertex is connected to three unlabeled endpoints\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:12px auto\"><path d=\"M55 100 L150 48 L245 100 M150 48 L150 8\" fill=\"none\" stroke=\"#174ea6\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>",
    "c": [
      "Butane",
      "2-Methylpropane",
      "2-Methylbutane",
      "Propane"
    ],
    "a": 1,
    "e": "There are four carbons total. The longest chain has three carbons, with a methyl group on carbon 2: 2-methylpropane."
  },
  {
    "q": "How many constitutional isomers does C₅H₁₂ have?",
    "c": [
      "2",
      "3",
      "4",
      "5"
    ],
    "a": 1,
    "e": "There are three: pentane, 2-methylbutane, and 2,2-dimethylpropane."
  },
  {
    "q": "Which pair consists of two distinct constitutional isomers of C₆H₁₄?",
    "c": [
      "2-Methylpentane and 3-methylpentane",
      "2-Methylpentane and 4-methylpentane",
      "Hexane and heptane",
      "Butane and 2-methylpropane"
    ],
    "a": 0,
    "e": "Both have six carbons and fourteen hydrogens, but their methyl branches are on different positions that cannot be matched by reversing the chain."
  },
  {
    "q": "At the same pressure, which of these C₆H₁₄ isomers is expected to have the higher boiling point?",
    "c": [
      "Hexane",
      "2,2-Dimethylbutane",
      "Both necessarily have the same boiling point",
      "Neither can boil"
    ],
    "a": 0,
    "e": "Hexane boils at a higher temperature than the compact, highly branched 2,2-dimethylbutane. This comparison is between isomers with the same molecular formula."
  }
];

/* ============================
       QUIZ LOGIC
============================= */

let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
    <div class='choices'></div>
    <div class='explanation' id='explanationBox' role='status' aria-live='polite'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;
  selected = i;
  document.querySelectorAll(".choice").forEach((btn, idx) => {
    btn.classList.toggle("selected", idx === i);
    if (idx === quizData[current].a) btn.classList.add("correct");
    if (idx === i && i !== quizData[current].a) btn.classList.add("incorrect");
    btn.disabled = true;
  });
  const q = quizData[current];
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br><strong>Correct answer:</strong> ${q.c[q.a]}<br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Sending your result to LearnTrack...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Result sent. Retake the quiz to meet the 80% target.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();

</script>
</body>
</html>
