<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter 4 – Lesson 1 Quiz: Alkanes & Alkane Isomers</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e8f9f1, #f7faff);
    margin: 0;
    padding: 40px 20px;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .quiz-container {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    width: 95%;
    max-width: 850px;
    text-align: center;
  }

  * { box-sizing: border-box; }
  .choice:focus-visible, button:focus-visible { outline: 3px solid #ad7115; outline-offset: 3px; }
  .choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
  .choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
  .choice:disabled { opacity: 1; cursor: default; }
  .quiz-btn:disabled { opacity: .5; cursor: not-allowed; }
  h2 {
    color: #136f63;
    margin-bottom: 25px;
    font-size: 1.8em;
  }

  /* Progress */
  .progress-text {
    text-align: right;
    font-size: 0.95em;
    color: #174ea6;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .progress-wrapper {
    background: #e9f5ef;
    border-radius: 8px;
    height: 14px;
    width: 100%;
    margin-bottom: 25px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, #136f63, #2b7de9);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* Question */
  .question {
    font-size: 1.3em;
    font-weight: 600;
    color: #174ea6;
    margin-bottom: 20px;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }
  .choice {
    background: #e8ecf8;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-size: 1.05em;
    transition: 0.2s;
  }
  .choice:hover { background: #d3dbf8; transform: translateY(-2px); }
  .choice.selected { background: #174ea6; color: #fff; transform: scale(1.02); }

  .explanation {
    background: #eef3ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 10px;
    display: none;
    text-align: left;
    font-size: 1.05em;
  }

  /* Buttons */
  .next-btn {
    background: #136f63;
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
  }
  .next-btn:hover { background: #0f5b52; }

  /* Result */
  .result {
    font-size: 1.4em;
    font-weight: bold;
    color: #174ea6;
    margin-top: 12px;
  }
  .stars {
    font-size: 2.5em;
    margin-top: 10px;
  }

  .quiz-nav {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .quiz-btn {
    background: #e8ecf8;
    color: #174ea6;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 0.95em;
    transition: 0.2s;
  }
  .quiz-btn:hover { background: #d3dbf8; transform: translateY(-2px); }
  .quiz-btn.primary { background: #136f63; color: #fff; }
  .quiz-btn.primary:hover { background: #0f5b52; }

  @media(max-width:600px){
    .quiz-container { padding: 25px; }
    .question { font-size: 1.15em; }
    .stars { font-size: 2em; }
  }
.choice.correct { background: #e1ecff; color: #123c80; border: 2px solid #174ea6; }
.choice.incorrect { background: #fde9ed; color: #8a1d2a; border: 2px solid #b22b3b; }
</style>
</head>

<body>

<div class="quiz-container">
  <h2>Lesson 1 Quiz – Alkanes & Alkane Isomers</h2>

  <p>12 questions · Pass: 10/12 (80% required). Choose one answer; your first choice is final. Read the explanation before continuing.</p>
  <div id="progressText" class="progress-text">Question 1 of 12</div>
  <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>

  <div id="quizBox"></div>
  <button id="nextBtn" class="next-btn" style="display:none;">Next</button>
</div>

<script>
/* ============================
     QUIZ DATA
============================= */

const quizData = [
  {
    "q": "Which general formula applies to an acyclic alkane with n carbon atoms?",
    "c": [
      "CₙH₂ₙ",
      "CₙH₂ₙ₊₂",
      "CₙH₂ₙ₋₂",
      "CₙHₙ"
    ],
    "a": 1,
    "e": "An acyclic saturated hydrocarbon has formula CₙH₂ₙ₊₂. The formula is for open-chain alkanes."
  },
  {
    "q": "What is the molecular formula of an acyclic alkane with seven carbon atoms?",
    "c": [
      "C₇H₁₄",
      "C₇H₁₆",
      "C₇H₁₂",
      "C₇H₁₈"
    ],
    a: 1,
    "e": "Use H = 2n + 2. With n = 7, H = 16, giving C₇H₁₆."
  },
  {
    "q": "Which description best fits an alkane?",
    "c": [
      "A hydrocarbon containing only single bonds",
      "A hydrocarbon containing at least one C=C bond",
      "A compound containing carbon and oxygen",
      "A hydrocarbon containing at least one C≡C bond"
    ],
    a: 0,
    "e": "Alkanes are saturated hydrocarbons containing carbon and hydrogen joined by single bonds."
  },
  {
    "q": "How many carbon atoms are shown in this skeletal structure?<svg viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"A zigzag of three connected segments, with four unlabeled carbon positions\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:12px auto\"><path d=\"M30 80 L100 35 L170 80 L240 35\" fill=\"none\" stroke=\"#174ea6\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>",
    "c": [
      "3",
      "4",
      "5",
      "6"
    ],
    a: 1,
    "e": "Count both ends and both corners. The three bonds connect four carbon positions."
  },
  {
    "q": "What is the molecular formula represented by CH₃CH(CH₃)CH₃?",
    "c": [
      "C₃H₈",
      "C₄H₈",
      "C₄H₁₀",
      "C₅H₁₂"
    ],
    a: 2,
    "e": "The parenthesized CH₃ is attached to the preceding CH. Counting all groups gives four carbons and ten hydrogens."
  },
  {
    "q": "Which statement describes constitutional isomers?",
    "c": [
      "Same molecular formula and different atom connectivity",
      "Same connectivity and only a different orientation on the page",
      "Different molecular formulas and the same connectivity",
      "Same connectivity and only a rotation about a single bond"
    ],
    a: 0,
    "e": "Constitutional isomers have the same molecular formula but differ in how atoms are connected."
  },
  {
    "q": "What is the relationship between butane and 2-methylpropane?",
    "c": [
      "They have different molecular formulas",
      "They are constitutional isomers of C₄H₁₀",
      "They are the same molecule drawn backwards",
      "They are cis–trans isomers"
    ],
    a: 1,
    "e": "Both are C₄H₁₀, but their carbon connectivity differs. They are the two constitutional isomers of this formula."
  },
  {
    "q": "Which structure represents the same connectivity as CH₃CH₂CH(CH₃)CH₃?",
    "c": [
      "CH₃CH(CH₃)CH₂CH₃",
      "CH₃CH₂CH₂CH₂CH₃",
      "C(CH₃)₄",
      "CH₃CH(CH₃)CH₃"
    ],
    a: 0,
    "e": "Reading from the other end gives CH₃CH(CH₃)CH₂CH₃. Both drawings represent 2-methylbutane."
  },
  {
    "q": "What is the IUPAC name of the alkane represented by this skeletal structure?<svg viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"One central vertex is connected to three unlabeled endpoints\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:12px auto\"><path d=\"M55 100 L150 48 L245 100 M150 48 L150 8\" fill=\"none\" stroke=\"#174ea6\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>",
    "c": [
      "Butane",
      "2-Methylpropane",
      "2-Methylbutane",
      "Propane"
    ],
    a: 1,
    "e": "There are four carbons total. The longest chain has three carbons, with a methyl group on carbon 2: 2-methylpropane."
  },
  {
    "q": "How many constitutional isomers does C₅H₁₂ have?",
    "c": [
      "2",
      "3",
      "4",
      "5"
    ],
    a: 1,
    "e": "There are three: pentane, 2-methylbutane, and 2,2-dimethylpropane."
  },
  {
    "q": "Which pair consists of two distinct constitutional isomers of C₆H₁₄?",
    "c": [
      "2-Methylpentane and 3-methylpentane",
      "2-Methylpentane and 4-methylpentane",
      "Hexane and heptane",
      "Butane and 2-methylpropane"
    ],
    a: 0,
    "e": "Both have six carbons and fourteen hydrogens, but their methyl branches are on different positions that cannot be matched by reversing the chain."
  },
  {
    "q": "At the same pressure, which of these C₆H₁₄ isomers is expected to have the higher boiling point?",
    "c": [
      "Hexane",
      "2,2-Dimethylbutane",
      "Both necessarily have the same boiling point",
      "Neither can boil"
    ],
    a: 0,
    "e": "Hexane boils at a higher temperature than the compact, highly branched 2,2-dimethylbutane. This comparison is between isomers with the same molecular formula."
  }
];

/* ============================
       QUIZ LOGIC
============================= */

const PASS_PERCENT = 80;
const letters = ['A','B','C','D'];
let current = 0;
let answers = Array(quizData.length).fill(null);
let resultSent = false;
let completed = false;
const quizBox = document.getElementById('quizBox');
const nextBtn = document.getElementById('nextBtn');
const progressText = document.getElementById('progressText');
const progressBar = document.getElementById('progressBar');
const progressMeter = document.getElementById('progressMeter');

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function isEmbedded() { return window.parent !== window; }
function updateProgress() {
  const count = answers.filter(value => value !== null).length;
  progressBar.style.width = (count / quizData.length * 100) + '%';
  progressMeter.setAttribute('aria-valuenow', String(count));
  progressMeter.setAttribute('aria-valuemax', String(quizData.length));
  progressMeter.setAttribute('aria-valuetext', `${count} of ${quizData.length} questions answered`);
  progressText.textContent = completed ? `Quiz completed · ${count} of ${quizData.length} answered` : `Question ${current + 1} of ${quizData.length} · ${count} answered`;
}
function renderEvidence(data) {
  const wrap = element('div','table-wrap evidence');
  wrap.tabIndex = 0; wrap.setAttribute('role','region'); wrap.setAttribute('aria-label',data.caption);
  const table = element('table'); table.append(element('caption','',data.caption));
  const head = element('thead'); const heading = element('tr');
  data.headers.forEach(text => { const cell=element('th','',text); cell.scope='col'; heading.append(cell); });
  head.append(heading); table.append(head);
  const body=element('tbody');
  data.rows.forEach(row => { const tr=element('tr'); row.forEach((text,i) => { const td=element(i===0?'th':'td','',text); if(i===0)td.scope='row'; tr.append(td); }); body.append(tr); });
  table.append(body);wrap.append(table);return wrap;
}
function showQuestion(focus = false) {
  const q = quizData[current];
  quizBox.replaceChildren();
  const heading = element('h2', 'question', q.q);
  heading.id = 'questionTitle'; heading.tabIndex = -1;
  const choices = element('div', 'choices');
  choices.setAttribute('role','group'); choices.setAttribute('aria-labelledby','questionTitle');
  q.c.forEach((text, i) => {
    const button = element('button', 'choice'); button.type = 'button';
    button.setAttribute('data-choice', String(i));
    const body = element('span', 'choice-body');
    body.append(element('span', 'choice-label', text), element('span','choice-status'));
    button.append(body);
    button.addEventListener('click', () => selectChoice(i));
    choices.append(button);
  });
  const feedback = element('div','explanation');
  feedback.id = 'explanationBox'; feedback.hidden = true; feedback.tabIndex = -1;
  feedback.setAttribute('role','status'); feedback.setAttribute('aria-live','polite');
  feedback.setAttribute('aria-atomic','true');
  quizBox.append(heading);
  if (q.evidence) quizBox.append(renderEvidence(q.evidence));
  quizBox.append(choices, feedback);
  nextBtn.hidden = true; nextBtn.disabled = true;
  nextBtn.textContent = current === quizData.length - 1 ? 'View Results →' : 'Next Question →';
  updateProgress();
  if (focus) heading.focus();
}
function selectChoice(index) {
  if (completed || answers[current] !== null || !Number.isInteger(index) || index < 0 || index > 3) return;
  const q = quizData[current];
  answers[current] = index;
  const correct = index === q.a;
  quizBox.querySelectorAll('.choice').forEach((button,i) => {
    button.disabled = true;
    const status = button.querySelector('.choice-status');
    if (i === q.a) {
      button.classList.add('correct');
      status.textContent = correct ? '✓ Your answer — correct' : '✓ Correct answer';
    } else if (i === index) {
      button.classList.add('incorrect');
      status.textContent = '✗ Your answer — incorrect';
    }
  });
  const feedback = document.getElementById('explanationBox');
  feedback.classList.toggle('incorrect-feedback', !correct);
  feedback.append(element('h3','',correct ? 'Correct.' : 'Not quite.'));
  if (!correct) feedback.append(element('p','',q.why[index]));
  feedback.append(element('p','correct-answer',`Correct answer: ${letters[q.a]}. ${q.c[q.a]}`),element('p','',q.e));
  feedback.hidden = false;
  nextBtn.hidden = false; nextBtn.disabled = false;
  updateProgress();
  feedback.focus();
}
function nextQuestion() {
  if (completed || answers[current] === null) return;
  if (current === quizData.length - 1) showResult();
  else { current += 1; showQuestion(true); }
}
function starCount(percent) { return percent === 100 ? 3 : percent >= 90 ? 2 : percent >= 80 ? 1 : 0; }
function getScore() { return answers.reduce((total,value,index) => total + (value === quizData[index].a ? 1 : 0),0); }
function sendResult(percent,passed) {
  if (resultSent || !isEmbedded()) return;
  resultSent = true;
  // Preserve the LearnTrack quizResult message format.
  window.parent.postMessage({type:'quizResult',score:percent,passed},'*');
}
function showResult() {
  if (completed || answers.some(value => value === null)) return;
  completed = true;
  const score = getScore();
  const percent = Math.round(score / quizData.length * 100);
  const passed = percent >= PASS_PERCENT;
  const stars = starCount(percent);
  quizBox.replaceChildren(); nextBtn.hidden = true; nextBtn.disabled = true;
  updateProgress();
  const result = element('section','quiz-result-panel');
  const starDisplay = element('div','stars','★'.repeat(stars)+'☆'.repeat(3-stars));
  starDisplay.setAttribute('role','img');starDisplay.setAttribute('aria-label',`${stars} out of 3 stars`);
  const title = element('h2','result',`You scored ${score}/${quizData.length} (${percent}%)`);
  title.id = 'resultTitle'; title.tabIndex = -1; result.setAttribute('aria-labelledby','resultTitle');
  const outcome = passed ? 'Passed — you met the 80% target.' : 'Not yet passed — review the explanations, then retry.';
  const status = element('p','save-status');status.id = 'saveStatus';status.setAttribute('role','status');
  status.textContent = isEmbedded()
    ? 'Waiting for LearnTrack to verify and save your answers...'
    : 'Preview mode: this attempt is not saved. Open the quiz inside LearnTrack to record progress and use lesson navigation.';
  result.append(starDisplay,title,element('p','result-status',outcome),status);
  const nav = element('nav','quiz-nav');nav.setAttribute('aria-label','Quiz result actions');
  const back = element('button','quiz-btn','← Back to Lesson');back.type='button';back.id='backBtn';back.disabled=!isEmbedded();
  const retry = element('button','quiz-btn','Retry Quiz');retry.type='button';retry.id='retryBtn';
  const next = element('button','quiz-btn primary','Next Lesson →');next.type='button';next.id='nextLessonBtn';next.disabled=true;
  back.addEventListener('click',()=>{if(isEmbedded())window.parent.postMessage({type:'quizBack'},'*');});
  retry.addEventListener('click',retryQuiz);
  next.addEventListener('click',()=>{if(passed && isEmbedded())window.parent.postMessage({type:'quizNextLesson'},'*');});
  nav.append(back,retry,next);result.append(nav);quizBox.append(result);
  renderTopicSummary();renderReview();
  sendResult(percent,passed);title.focus();
}
function renderTopicSummary() {
  const wrap = element('div','table-wrap');
  const table = element('table');table.append(element('caption','','Your review priorities'));
  const head=element('thead');const header=element('tr');
  ['Area','Score','Next step'].forEach(text=>{const th=element('th','',text);th.scope='col';header.append(th);});head.append(header);table.append(head);
  const body=element('tbody');
  [...new Set(quizData.map(q=>q.topic))].forEach(topic=>{
    const indices=quizData.map((q,i)=>q.topic===topic?i:-1).filter(i=>i>=0);
    const correct=indices.filter(i=>answers[i]===quizData[i].a).length;
    const row=element('tr');const name=element('th','',topic);name.scope='row';
    row.append(name,element('td','',`${correct}/${indices.length}`),element('td','',correct===indices.length?'All correct this attempt':'Review the related explanations below'));
    body.append(row);
  });table.append(body);wrap.append(table);quizBox.append(wrap);
}
function renderReview() {
  const section=element('section','review-section');
  section.append(element('h3','','Review your answers'),element('p','small','Open any question to compare your answer with the explanation. Retry starts a new attempt with the same question and choice order.'));
  quizData.forEach((q,index)=>{
    const correct=answers[index]===q.a;
    const details=element('details');
    details.append(element('summary','',`Question ${index+1} · ${correct?'Correct':'Review needed'}`),element('p','review-question',q.q),element('p','review-choice',`Your answer: ${letters[answers[index]]}. ${q.c[answers[index]]}`),element('p','correct-answer',`Correct answer: ${letters[q.a]}. ${q.c[q.a]}`),element('p','review-answer',q.e));
    if (q.evidence) details.querySelector('.review-question').after(renderEvidence(q.evidence));
    const all=element('details');all.append(element('summary','','Why each option fits or does not fit'));
    q.c.forEach((text,i)=>all.append(element('p','review-choice',`${letters[i]}. ${text} — ${q.why[i]}`)));
    details.append(all);section.append(details);
  });quizBox.append(section);
}
function retryQuiz() {
  current=0;answers=Array(quizData.length).fill(null);completed=false;resultSent=false;
  showQuestion(true);
}
nextBtn.addEventListener('click',nextQuestion);
showQuestion();
</script>
</body>
</html>
